
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Skabratts | Official Website</title>
<meta name="description" content="The Skabratts — traditional Jamaican-style ska and rocksteady from London. Tickets, merch, music and Tour Club.">

<style>
  :root { --bg: #050505; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .front-page {
    position: relative;
    width: min(100%, 864px);
    line-height: 0;
  }

  .front-page img {
    display: block;
    width: 100%;
    height: auto;
  }

  .hotspot {
    position: absolute;
    display: block;
    border-radius: 999px;
    text-decoration: none;
  }

  .hotspot:hover,
  .hotspot:focus-visible {
    outline: 3px solid #ffb51b;
    outline-offset: 2px;
    box-shadow: 0 0 20px rgba(255,181,27,.5);
  }

  /* Main buttons */
  .tickets {
    left: 25.8%;
    top: 53.3%;
    width: 49%;
    height: 6.6%;
  }

  .merch {
    left: 25.8%;
    top: 61%;
    width: 49%;
    height: 6.3%;
  }

  .music {
    left: 26%;
    top: 68.5%;
    width: 49%;
    height: 6.4%;
  }

  /* Tour Club */
  .tourclub {
    left: 5.8%;
    top: 76.4%;
    width: 88.4%;
    height: 12.3%;
  }

  /* Contact details */
  .email {
    left: 50%;
    top: 90.7%;
    width: 47%;
    height: 3%;
  }

  .phone {
    left: 50%;
    top: 93.7%;
    width: 43%;
    height: 3%;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>

<body>
<main class="front-page" aria-label="The Skabratts homepage">

  <img src="front-page.png_20261009_105145_0000.png"
       alt="The Skabratts official website"
       width="864"
       height="1536">

  <a class="hotspot tickets"
     href="tour.html"
     aria-label="Tickets">
    <span class="sr-only">Tickets</span>
  </a>

  <a class="hotspot merch"
     href="https://199962-2.myshopify.com/pages/run-the-track-crowdfund"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Merch">
    <span class="sr-only">Merch</span>
  </a>

  <a class="hotspot music"
     href="https://open.spotify.com/artist/2ij26uS1XGAfLd1b8d7wLZ"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Music">
    <span class="sr-only">Music</span>
  </a>

  <a class="hotspot tourclub"
     href="https://mailchi.mp/ea0c609e8658/the-skabratts-tour-club"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Join our free Tour Club">
    <span class="sr-only">Join our free Tour Club</span>
  </a>

  <a class="hotspot email"
     href="mailto:theskabratts@gmail.com"
     aria-label="Email The Skabratts">
    <span class="sr-only">Email</span>
  </a>

  <a class="hotspot phone"
     href="tel:+447747295795"
     aria-label="Call The Skabratts">
    <span class="sr-only">Telephone</span>
  </a>

</main>
</body>
</html>
